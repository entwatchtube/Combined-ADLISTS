name: Daily Combine Adblock Filters

on:
  schedule:
    - cron: '30 18 * * *' # 00:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combine-filters
  cancel-in-progress: true

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Show repo root (debug)
        run: |
          echo "Working directory: $(pwd)"
          echo "Repo files:"
          ls -la

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-cache-${{ runner.os }}-

      - name: Show requirements.txt (debug)
        run: |
          if [ -f requirements.txt ]; then
            echo "requirements.txt found:"
            sed -n '1,200p' requirements.txt
          else
            echo "requirements.txt NOT found at repo root"
            ls -la
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --no-cache-dir
          echo "Installed packages:"
          python -m pip list

      - name: Run combine script
        run: |
          python combine_filters.py

      - name: Commit and push combined_filters.txt
        run: |
          if [[ -n "$(git status --porcelain combined_filters.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add combined_filters.txt
            git commit -m "chore: update combined_filters.txt (daily)"
            git push
          else
            echo "No changes to combined_filters.txt"
          fi
