name: Daily Combine Adblock Filters

on:
  schedule:
    - cron: '30 18 * * *' # runs at 00:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combine-filters
  cancel-in-progress: true

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Show environment (debug)
        run: |
          echo "PWD: $(pwd)"
          echo "Python: $(which python) -> $(python --version)"
          python -m site
          ls -la

      - name: Ensure requirements.txt exists
        run: |
          if [ ! -f requirements.txt ]; then
            echo "Missing requirements.txt at repo root" >&2
            exit 1
          fi
          echo "requirements.txt content:"
          sed -n '1,200p' requirements.txt

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-cache-${{ runner.os }}-

      - name: Install Python dependencies (explicit)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-cache-dir -r requirements.txt
          echo "pip install exit code: $?"
          python -m pip list

      - name: Verify requests importable (will fail clearly if not)
        run: |
          python - <<'PY'
          try:
              import requests
              print("requests OK:", requests.__version__)
          except Exception as e:
              print("requests import failed:", e)
              raise SystemExit(2)
          PY

      - name: Run combine script
        run: |
          python combine_filters.py

      - name: Show combined_filters.txt summary
        run: |
          if [ -f combined_filters.txt ]; then
            echo "combined_filters.txt exists; first 10 lines:"
            head -n 10 combined_filters.txt || true
            echo "total lines:"
            wc -l combined_filters.txt || true
          else
            echo "combined_filters.txt missing" >&2
            exit 1
          fi

      - name: Commit and push combined_filters.txt
        run: |
          if [[ -n "$(git status --porcelain combined_filters.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add combined_filters.txt
            git commit -m "chore: update combined_filters.txt (daily)"
            git push
          else
            echo "No changes to combined_filters.txt"
          fi
