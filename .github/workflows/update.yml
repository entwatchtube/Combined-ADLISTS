name: Daily Combine Adblock Filters

on:
  schedule:
    # 00:00 IST is 18:30 UTC previous day; run daily
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combine-filters
  cancel-in-progress: true

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
        # requirements.txt optional; script will vendor needed std libs but allow extras

      - name: Run combine script
        env:
          TZ: Asia/Kolkata
        run: |
          python combine_filters.py

      - name: Commit and push combined_filters.txt
        run: |
          if [[ -n "$(git status --porcelain combined_filters.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add combined_filters.txt
            git commit -m "chore: update combined_filters.txt (daily)"
            git push
          else
            echo "No changes to combined_filters.txt"
          fi
